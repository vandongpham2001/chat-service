server:
  port: ${CHAT_SERVICE_PORT}
  servlet:
    context-path: /chat

spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://${CHAT_MONGO_DB_USERNAME}:${CHAT_MONGO_DB_PASSWORD}@${CHAT_MONGO_DB_HOST}:${CHAT_MONGO_DB_PORT}/${CHAT_MONGO_DB_NAME}?authSource=admin
      auto-index-creation: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

app:
  services:
    identity:
      url: ${IDENTITY_SERVICE_HOST}/identity
    profile:
      url: ${PROFILE_SERVICE_HOST}/profile